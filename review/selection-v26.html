<!doctype html><html lang="ja"><meta charset="utf-8"><title>写真の色層を反映した水槽比較</title>
<style>body{margin:0;background:#20333c;color:#eef7fa;font:15px system-ui}header{padding:16px}button{padding:10px;font:inherit;margin:5px}output{display:block;margin:10px}canvas{display:block;max-width:100%;height:auto}#sources{position:fixed;left:0;top:0;z-index:-1;opacity:.001;pointer-events:none;display:flex}iframe{width:1280px;height:720px;border:0}.labels{display:flex;justify-content:space-around;padding:10px}</style>
<header>左：直前v25、右：スリムな輪郭・銀藤色・細い鱗のv26。1280×720、同じカメラ・魚配置・時刻。
<button id="step">10秒進める</button><button id="save">全景2枚と比較を保存</button><button id="record">新候補の動きを65秒保存</button><output id="status">読み込み中</output></header>
<div class="labels"><span>直前v25</span><span>スリムな輪郭・銀藤色・細い鱗のv26</span></div><canvas width="2560" height="720" id="result"></canvas><div id="sources"><iframe title="v25" src="/preview/selection-v25-new/scenes/riverscape/wallpaper.html?quality=balanced&review=1"></iframe><iframe title="v26" src="/preview/selection-v26-new/scenes/riverscape/wallpaper.html?quality=balanced&review=1"></iframe></div>
<script>
const views=[...document.querySelectorAll('iframe')],out=document.querySelector('canvas'),ctx=out.getContext('2d'),status=document.querySelector('#status');
let ready=false,recording=false,frame=0;const names=['v25','v26'];
const stamp=()=>new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z/,'Z');
function draw(){views.slice(0,2).forEach((v,i)=>ctx.drawImage(v.contentDocument.querySelector('canvas'),i*1280,0,1280,720));}
function step(){views.forEach(v=>v.contentWindow.sceneReviewStep(1/30));frame++;draw();}
function state(){const s=views.map(v=>v.contentWindow.sceneReviewState());let max=0;for(let j=1;j<s.length;j++)for(let i=0;i<s[0].positions.length;i++)for(let k=0;k<3;k++)max=Math.max(max,Math.abs(s[0].positions[i][k]-s[j].positions[i][k]));return {frame,time:s[0].time,maxFishPositionDelta:max,cameraEqual:s.every(x=>JSON.stringify(x.camera)===JSON.stringify(s[0].camera)),projectionEqual:s.every(x=>JSON.stringify(x.projection)===JSON.stringify(s[0].projection))};}
const timer=setInterval(()=>{if(views.every(v=>v.contentWindow.sceneReviewStep)){clearInterval(timer);views.forEach(v=>v.contentWindow.sceneReviewStep(0));ready=true;draw();status.textContent='準備完了。時刻0秒。';}},250);
async function save(blob,name){const r=await fetch('/capture/'+name,{method:'POST',body:blob});if(!r.ok)throw Error('保存失敗');return name;}
document.querySelector('#step').onclick=async()=>{if(!ready||recording)return;for(let i=0;i<300;i++){step();if(i%10===0)await new Promise(r=>setTimeout(r,0));}status.textContent=JSON.stringify(state());};
document.querySelector('#save').onclick=async()=>{if(!ready||recording)return;const date=stamp();for(let i=0;i<2;i++){const c=document.createElement('canvas');c.width=1280;c.height=720;views[i].contentWindow.sceneReviewStep(0);c.getContext('2d').drawImage(views[i].contentDocument.querySelector('canvas'),0,0,1280,720);await save(await new Promise(r=>c.toBlob(r)),`natural-v18-metrics-slim26-tank-${names[i]}-${frame}-${date}.png`);}views.forEach(v=>v.contentWindow.sceneReviewStep(0));draw();const name='natural-v18-metrics-slim26-tank-triple-'+frame+'-'+date;await save(await new Promise(r=>out.toBlob(r)),name+'.png');await save(new Blob([JSON.stringify(state(),null,2)],{type:'application/json'}),name+'.json');status.textContent='保存済み '+name;};
document.querySelector('#record').onclick=()=>{if(!ready||recording)return;recording=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);const c=document.createElement('canvas');c.width=1280;c.height=720;const cx=c.getContext('2d');const chunks=[],samples=[],name='natural-v18-tank-slim26-'+stamp();const rec=new MediaRecorder(c.captureStream(30),{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:6500000});rec.ondataavailable=e=>chunks.push(e.data);let last=0,count=0;rec.onstop=async()=>{await save(new Blob(chunks,{type:'video/webm'}),name+'.webm');await save(new Blob([JSON.stringify({samples},null,2)],{type:'application/json'}),name+'.json');recording=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);status.textContent='保存済み '+name;};rec.start();function run(now){if(last&&now-last<32){requestAnimationFrame(run);return;}last=now;step();cx.drawImage(views[1].contentDocument.querySelector('canvas'),0,0,1280,720);count++;if(count%30===0){samples.push(state());status.textContent='新候補 '+(count/30)+' / 65秒';}if(count>=1950){rec.stop();return;}requestAnimationFrame(run);}requestAnimationFrame(run);};
</script></html>
