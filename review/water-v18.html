<!doctype html><html lang="ja"><meta charset="utf-8"><title>水の比較 v18 — 同じ時刻・魚配置</title>
<style>body{margin:0;background:#20333c;color:#eef7fa;font:15px system-ui}header{padding:16px}button{padding:10px;font:inherit;margin:5px}output{display:block;margin:10px}canvas{display:block;max-width:100%;height:auto}#sources{position:fixed;left:0;top:0;z-index:-1;opacity:.001;pointer-events:none;display:flex}iframe{width:800px;height:520px;border:0}.labels{display:flex;justify-content:space-around;padding:10px}</style>
<header>水の処理だけを比較。魚の材質・配置・カメラ・乱数・時刻は同一。
<button id="step">10秒進める</button><button id="save">静止画を保存</button><button id="record">比較動画65秒を保存</button><output id="status">読み込み中</output></header>
<div class="labels"><span>水の変更前（魚はv18）</span><span>水の変更後（魚はv18）</span></div><canvas width="2000" height="650" id="result"></canvas>
<div id="sources"><iframe title="変更前" src="/preview/water-v18-final-before/scenes/riverscape/wallpaper.html?quality=balanced&review=1"></iframe><iframe title="変更後" src="/preview/water-v18-final-after/scenes/riverscape/wallpaper.html?quality=balanced&review=1"></iframe></div>
<script>
const views=[...document.querySelectorAll('iframe')],out=document.querySelector('canvas'),ctx=out.getContext('2d'),status=document.querySelector('#status');
let ready=false,recording=false,frame=0;const samples=[];
const stamp=()=>new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z/,'Z');
function draw(){views.forEach((v,i)=>ctx.drawImage(v.contentDocument.querySelector('canvas'),i*1000,0,1000,650));}
function step(){views.forEach(v=>v.contentWindow.sceneReviewStep(1/30));frame++;draw();}
function state(){const s=views.map(v=>v.contentWindow.sceneReviewState());let max=0;for(let i=0;i<s[0].positions.length;i++)for(let k=0;k<3;k++)max=Math.max(max,Math.abs(s[0].positions[i][k]-s[1].positions[i][k]));const result={frame,time:s[0].time,timeDelta:Math.abs(s[0].time-s[1].time),maxFishPositionDelta:max,cameraEqual:JSON.stringify(s[0].camera)===JSON.stringify(s[1].camera),projectionEqual:JSON.stringify(s[0].projection)===JSON.stringify(s[1].projection)};status.dataset.comparison=JSON.stringify(result);return result;}
const timer=setInterval(()=>{if(views.every(v=>v.contentWindow.sceneReviewStep)){clearInterval(timer);views.forEach(v=>v.contentWindow.sceneReviewStep(0));ready=true;draw();status.textContent='準備完了。2画面は同じ魚配置・時刻0秒。';state();}},250);
async function save(blob,name){const r=await fetch('/capture/'+name,{method:'POST',body:blob});if(!r.ok)throw Error('保存失敗');return name;}
document.querySelector('#step').onclick=async()=>{if(!ready||recording)return;for(let i=0;i<300;i++){step();if(i%10===0)await new Promise(r=>setTimeout(r,0));}status.textContent=JSON.stringify(state());};
document.querySelector('#save').onclick=async()=>{if(!ready||recording)return;draw();const name='natural-v18-metrics-water-'+frame+'-'+stamp();await save(await new Promise(r=>out.toBlob(r)),name+'.png');await save(new Blob([JSON.stringify(state(),null,2)],{type:'application/json'}),name+'.json');status.textContent='保存済み '+name;};
document.querySelector('#record').onclick=()=>{if(!ready||recording)return;recording=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);const chunks=[],name='natural-v18-tank-water-comparison-'+stamp();const rec=new MediaRecorder(out.captureStream(30),{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:8500000});rec.ondataavailable=e=>chunks.push(e.data);let last=0,count=0;rec.onstop=async()=>{await save(new Blob(chunks,{type:'video/webm'}),name+'.webm');await save(new Blob([JSON.stringify({method:'fixed 1/30 second steps, identical seeded simulation',samples},null,2)],{type:'application/json'}),name+'.json');recording=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);status.textContent='保存済み '+name;};rec.start();function run(now){if(last&&now-last<32){requestAnimationFrame(run);return;}last=now;step();count++;if(count%30===0){samples.push(state());status.textContent='同時比較 '+(count/30)+' / 65秒';}if(count>=1950){rec.stop();return;}requestAnimationFrame(run);}requestAnimationFrame(run);};
</script></html>
