<!doctype html><html lang="ja"><meta charset="utf-8"><title>v17 保存動画の再生確認</title><style>body{margin:20px;background:#172b35;color:#ecf7fb;font:16px system-ui}video{max-width:100%;max-height:80vh;display:block}button,select{font:inherit;margin:8px;padding:8px}output{display:block}</style><h1>v17 保存済み映像</h1><select id="which" aria-label="映像"><option value="tank">24匹の通常遊泳</option><option value="atlas">8色の全周比較</option></select><button id="play">先頭から再生</button><output id="state"></output><video id="v" controls muted playsinline preload="metadata"></video><script>const v=document.querySelector('video'),select=document.querySelector('select');const files={tank:'natural-v17-tank-after-20260928T134616Z.webm',atlas:'natural-v17-turn-atlas-turn-7-20260928T134722Z.webm'};function load(){v.src='/evidence/'+files[select.value]}load();select.onchange=load;document.querySelector('#play').onclick=()=>{v.currentTime=0;v.play()};setInterval(()=>document.querySelector('output').textContent=`${v.currentTime.toFixed(1)} / ${v.duration.toFixed(1)} 秒｜${v.ended?'再生完了':v.paused?'停止':'再生中'}｜エラー ${v.error?.code??'なし'}`,500);</script></html>
