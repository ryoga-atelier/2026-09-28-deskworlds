<!doctype html><html lang="ja"><meta charset="utf-8"><title>自然なグッピー水槽 — v17 / v18 比較</title>
<style>body{margin:0;background:#152320;color:#eef3ed;font:14px system-ui}header{padding:14px 20px}button,select{font:inherit;padding:8px 12px;margin:4px;background:#314740;color:inherit;border:1px solid #7a8c80;border-radius:5px}iframe{display:block;width:1280px;height:720px;border:0}output{display:block;margin:8px 4px;color:#bccfc3}</style>
<header>同じ1280×720表示・Balanced・画面条件固定で比較
<select aria-label="水槽の版" id="version"><option value="mixed-guppy-v17-r2">前 v17</option><option value="clearwater-guppy-v18-r8" selected>候補 v18</option></select>
<button id="save">全景を保存</button><button id="pause">停止</button><button id="feed">餌やり</button><button id="record">通常遊泳を65秒録画</button>
<output id="stats">読み込み中</output><output id="status"></output></header><iframe title="実際の水槽" id="tank"></iframe>
<script>
let paused=false,ready=false,recording=false;const frame=document.querySelector('iframe'),stats=document.querySelector('#stats'),status=document.querySelector('#status'),select=document.querySelector('select');
const stamp=()=>new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z/,'Z');
function load(){ready=false;paused=false;document.querySelector('#pause').textContent='停止';frame.src='/preview/'+select.value+'/scenes/riverscape/wallpaper.html?quality=balanced';}select.onchange=load;load();
setInterval(()=>{if(!ready){if(!frame.contentWindow.sceneStats)return;frame.contentWindow.scenePause(false);frame.contentWindow.sceneRate(30);ready=true;}const s=frame.contentWindow.sceneStats();stats.dataset.sceneStats=JSON.stringify(s);stats.textContent=`${select.value} / ${s.framebuffer.join('×')} / ${s.loop.running?'動作中':'停止'} / ${s.renderedFrames} frames / 実描画間隔中央値 ${s.frameTiming?.p50Ms?.toFixed(1)??'未計測'} ms`;},1000);
document.querySelector('#pause').onclick=e=>{paused=!paused;frame.contentWindow.scenePause(paused);e.target.textContent=paused?'再開':'停止';};document.querySelector('#feed').onclick=()=>frame.contentWindow.sceneFeed();
async function save(blob,name){const response=await fetch('/capture/'+name,{method:'POST',body:blob});if(!response.ok)throw Error('保存失敗');return name;}
document.querySelector('#save').onclick=async()=>{if(!ready)return;const c=frame.contentDocument.querySelector('canvas');const name='natural-v18-metrics-full-'+stamp();await save(await new Promise(r=>c.toBlob(r)),name+'.png');status.textContent='保存済み '+name;};
document.querySelector('#record').onclick=e=>{if(recording||!ready||paused)return;recording=true;const chunks=[],samples=[],start=performance.now(),version=select.value;const timer=setInterval(()=>samples.push({elapsedMs:performance.now()-start,stats:frame.contentWindow.sceneStats()}),1000);const recorder=new MediaRecorder(frame.contentDocument.querySelector('canvas').captureStream(30),{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:8000000});const name=`natural-v18-tank-${select.selectedIndex?'after':'before'}-${stamp()}`;recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async()=>{clearInterval(timer);await save(new Blob(chunks,{type:'video/webm'}),name+'.webm');await save(new Blob([JSON.stringify({version,elapsedMs:performance.now()-start,samples},null,2)],{type:'application/json'}),name+'.json');recording=false;e.target.disabled=false;select.disabled=false;status.textContent='保存済み：'+name;};recorder.start();e.target.disabled=true;select.disabled=true;status.textContent='通常遊泳を録画中';setTimeout(()=>recorder.stop(),65000);};
</script></html>
